<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mesa de ayuda</title>
  <!-- Tailwind por CDN: hace falta internet para que carguen los estilos -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="app.js" defer></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen">

  <header class="bg-gray-900 border-b-4 border-amber-400 p-5 text-center">
    <h1 class="text-2xl font-bold text-amber-400">Mesa de ayuda</h1>
    <p class="text-sm text-gray-400 mt-1">Tickets de soporte de la oficina</p>
  </header>

  <main class="max-w-7xl mx-auto p-4 md:p-8 grid gap-6 lg:grid-cols-3">

    <!-- Formulario: crea tickets y, desde el nivel 4, también los edita -->
    <section class="bg-white border border-gray-300 rounded p-6">
      <h2 id="titulo-formulario" class="text-lg font-bold text-gray-900 mb-4">Nuevo ticket</h2>

      <form id="form-ticket" novalidate class="space-y-4">
        <label for="titulo" class="block text-sm font-semibold text-gray-600 mb-1">Título</label>
        <input id="titulo" name="titulo" type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-300">
        <p id="error-titulo" class="text-sm text-red-600 mt-1"></p>

        <label for="descripcion" class="block text-sm font-semibold text-gray-600 mb-1">Descripción</label>
        <textarea id="descripcion" name="descripcion" rows="3" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-300"></textarea>

        <label for="solicitante" class="block text-sm font-semibold text-gray-600 mb-1">Solicitante</label>
        <input id="solicitante" name="solicitante" type="text" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-300">
        <p id="error-solicitante" class="text-sm text-red-600 mt-1"></p>

        <label for="categoria" class="block text-sm font-semibold text-gray-600 mb-1">Categoría</label>
        <select id="categoria" name="categoria" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-300">
          <option value="hardware">Hardware</option>
          <option value="software">Software</option>
          <option value="red">Red</option>
          <option value="accesos">Accesos</option>
        </select>

        <label for="prioridad" class="block text-sm font-semibold text-gray-600 mb-1">Prioridad</label>
        <select id="prioridad" name="prioridad" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-300">
          <option value="baja">Baja</option>
          <option value="media" selected>Media</option>
          <option value="alta">Alta</option>
        </select>

        <button id="btn-guardar" type="submit" class="w-full bg-gray-900 rounded px-4 py-2 text-sm font-bold text-amber-400 hover:bg-gray-700 cursor-pointer">Crear ticket</button>
        <button id="btn-cancelar" type="button" class="w-full border border-gray-400 rounded px-4 py-2 text-sm font-semibold text-gray-700 hover:bg-gray-100 cursor-pointer" hidden>Cancelar edición</button>
      </form>
    </section>

    <!-- Tablero -->
    <section class="bg-white border border-gray-300 rounded p-6 lg:col-span-2">
      <h2 class="text-lg font-bold text-gray-900 mb-4">Tickets</h2>

      <div id="resumen" class="flex flex-wrap gap-2 mb-4"></div>

      <div class="flex flex-col gap-3 md:flex-row md:items-end mb-4">
        <label for="filtro-estado" class="block text-sm font-semibold text-gray-600 mb-1">Estado</label>
        <select id="filtro-estado" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-300">
          <option value="todos">Todos</option>
          <option value="abierto">Abiertos</option>
          <option value="en_progreso">En progreso</option>
          <option value="resuelto">Resueltos</option>
        </select>

        <label for="busqueda" class="block text-sm font-semibold text-gray-600 mb-1">Buscar</label>
        <input id="busqueda" type="search" placeholder="Buscar por título" class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:border-amber-500 focus:ring-2 focus:ring-amber-300">
      </div>

      <p id="mensaje" hidden></p>

      <div id="lista-tickets" class="grid gap-4 md:grid-cols-2"></div>
    </section>

  </main>

</body>
</html>
